<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#0353A4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" />

  <!-- Subtle decorative circles -->
  <circle cx="980" cy="100" r="220" fill="#38BDF8" opacity="0.08" />
  <circle cx="100" cy="980" r="260" fill="#38BDF8" opacity="0.06" />

  <!-- Top Brand Header -->
  <rect x="64" y="54" width="240" height="48" rx="24" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" />
  <text x="184" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="900" fill="#FFFFFF" letter-spacing="1">FOODSAFE365</text>

  <rect x="640" y="54" width="376" height="48" rx="24" fill="#E0F2FE" />
  <text x="828" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0F172A" letter-spacing="0.8">SLIDE 2 / 5 · DINERBENEFITS</text>

  <!-- Main Headlines -->
  <text x="64" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF">Rate a Restaurant or Club</text>
  <text x="64" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" fill="#38BDF8">Same Day or the Next Day</text>
  <text x="64" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF">(With Date of Visit)</text>

  <!-- Subline -->
  <text x="64" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#CBD5E1">Your post-meal feedback is emailed &amp; SMSed directly to the restaurant</text>

  <!-- Role Badge Pill -->
  <rect x="64" y="396" width="520" height="44" rx="10" fill="rgba(16, 185, 129, 0.22)" stroke="#38BDF8" stroke-width="1.5" />
  <text x="86" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#E0F2FE" letter-spacing="1">FOR CUSTOMERS &amp; CLUB MEMBERS</text>

  <!-- 3 Feature Cards -->
  
      <rect x="64" y="465" width="952" height="138" rx="22" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.24)" stroke-width="2" />
      <circle cx="86" cy="503" r="8" fill="#38BDF8" />
      <text x="108" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">Rate Right at the Table (Sensory &amp; Visible Hygiene)</text>
      <text x="108" y="547" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#E2E8F0"><tspan x="108" dy="0">Clean cutlery/plates, server handling, piping-hot fresh food,</tspan><tspan x="108" dy="25">cooking oil quality &amp; safe water.</tspan></text>
    
      <rect x="64" y="623" width="952" height="138" rx="22" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.24)" stroke-width="2" />
      <circle cx="86" cy="661" r="8" fill="#38BDF8" />
      <text x="108" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">Rate the Next Day if You Had Stomach Upset</text>
      <text x="108" y="705" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#E2E8F0"><tspan x="108" dy="0">Loose motion or vomiting often happens 6–24 hrs later. Pick your</tspan><tspan x="108" dy="25">Date of Visit and report it.</tspan></text>
    
      <rect x="64" y="781" width="952" height="138" rx="22" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.24)" stroke-width="2" />
      <circle cx="86" cy="819" r="8" fill="#38BDF8" />
      <text x="108" y="826" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">Direct Email &amp; SMS Alert to the Restaurant / Club</text>
      <text x="108" y="863" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#E2E8F0"><tspan x="108" dy="0">Your rating is sent straight to restaurant management to inspect</tspan><tspan x="108" dy="25">their chillers &amp; raw stock.</tspan></text>
    

  <!-- Footer Bar -->
  <rect x="0" y="990" width="1080" height="90" fill="rgba(0,0,0,0.32)" />
  <text x="64" y="1044" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">www.foodsafe365.in  ·  foodsafe365@gmail.com</text>
  <text x="1016" y="1044" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#38BDF8">Independent Food-Safety Platform</text>
</svg>