<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FoodSafe365</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f17;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justifyContent: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(5, 150, 105, 0.4);
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; max-width: 320px; margin-bottom: 24px; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">FS</div>
  <h1>FoodSafe365</h1>
  <p>Connecting to Food Safety Management Cloud...</p>
  <div class="spinner"></div>
  <script>
    // Automatically redirect to production cloud URL if loaded locally
    if (window.location.protocol === 'file:' || window.location.hostname === 'localhost') {
      setTimeout(() => {
        window.location.href = 'https://food-safe365.vercel.app/home';
      }, 300);
    }
  </script>
</body>
</html>
