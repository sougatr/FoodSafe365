      - status
      - priority
    ActionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CorrectiveAction'
        meta:
          $ref: '#/components/schemas/Pagination'
    AssignRequest:
      type: object
      properties:
        assignee_user_id: *id001
      required:
      - assignee_user_id
    VerifyRequest:
      type: object
      properties:
        result:
          type: string
          enum:
