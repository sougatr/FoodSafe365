          - RESOLVED
        created_at:
          type: string
          format: date-time
      required:
      - id
      - outlet_id
      - status
    ObservationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        meta:
          $ref: '#/components/schemas/Pagination'
    ActionCreate:
