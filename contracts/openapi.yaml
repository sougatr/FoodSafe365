components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganisationId:
      name: organisation_id
      in: path
      required: true
      schema: *id001
    OutletId:
      name: outlet_id
      in: path
      required: true
      schema: *id001
    RuleId:
      name: rule_id
      in: path
      required: true
      schema: *id001
    CheckId:
      name: check_id
      in: path
      required: true
      schema: *id001
    ObservationId:
      name: observation_id
      in: path
      required: true
      schema: *id001
    ActionId:
      name: action_id
      in: path
      required: true
      schema: *id001
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: *id001
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema: *id001
    PlanId:
      name: plan_id
      in: path
      required: true
      schema: *id001
    HazardId:
      name: hazard_id
      in: path
      required: true
      schema: *id001
    CcpId:
      name: ccp_id
      in: path
      required: true
      schema: *id001
    RequestId:
      name: request_id
      in: path
      required: true
      schema: *id001
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Not authorised
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
          required:
          - code
          - message
          - request_id
      required:
      - error
    User:
      type: object
      properties:
        id: *id001
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
      - id
      - name
      - email
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        mobile:
          type: string
        password:
          type: string
          minLength: 10
          writeOnly: true
      required:
      - name
      - email
      - mobile
      - password
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - identifier
      - password
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          writeOnly: true
      required:
      - refresh_token
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - refresh_token
      - expires_in
      - user
    Lookup:
      type: object
      properties:
        id: *id001
        code:
          type: string
        name:
          type: string
        description:
          type: string
      required:
      - id
      - name
    OrganisationCreate:
      type: object
      properties:
        name:
          type: string
        legal_name:
          type: string
        timezone:
          type: string
          default: Asia/Kolkata
      required:
      - name
    Organisation:
      type: object
      properties:
        id: *id001
        name:
          type: string
        legal_name:
          type: string
        timezone:
          type: string
      required:
      - id
      - name
    OrganisationUpdate:
      type: object
      properties:
        name:
          type: string
        legal_name:
          type: string
        timezone:
          type: string
    OutletCreate:
      type: object
      properties:
        name:
          type: string
        restaurant_type_id: *id001
        city:
          type: string
        address:
          type: string
        timezone:
          type: string
          default: Asia/Kolkata
      required:
      - name
      - restaurant_type_id
      - city
    Outlet:
      type: object
      properties:
        id: *id001
        organisation_id: *id001
        name:
          type: string
        restaurant_type_id: *id001
        city:
          type: string
        address:
          type: string
        timezone:
          type: string
      required:
      - id
      - organisation_id
      - name
    OutletUpdate:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        address:
          type: string
        timezone:
          type: string
    IdsRequest:
      type: object
      properties:
        ids:
          type: array
          items: *id001
          minItems: 1
      required:
      - ids
    EquipmentCreate:
      type: object
      properties:
        equipment_type_id: *id001
        name:
          type: string
        location:
          type: string
      required:
      - equipment_type_id
      - name
    Equipment:
      type: object
      properties:
        id: *id001
        outlet_id: *id001
        equipment_type_id: *id001
        name:
          type: string
        location:
          type: string
      required:
      - id
      - outlet_id
      - name
    Rule:
      type: object
      properties:
        id: *id001
        code:
          type: string
        title:
          type: string
        domain:
          type: string
        risk_level:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        frequency:
          type: string
        active:
          type: boolean
        version:
          type: integer
        source_id: *id001
        applicability:
          type: object
          additionalProperties: true
        failure_condition:
          type: string
        immediate_action:
          type: string
        corrective_action:
          type: string
        verification:
          type: string
      required:
      - id
      - code
      - title
      - domain
      - risk_level
      - active
      - version
    RuleList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        meta:
          $ref: '#/components/schemas/Pagination'
    CheckPlan:
      type: object
      properties:
        outlet_id: *id001
        generated_at:
          type: string
          format: date-time
        daily_count:
          type: integer
        weekly_count:
          type: integer
        temperature_count:
          type: integer
        documents_count:
          type: integer
    Check:
      type: object
      properties:
        id: *id001
        outlet_id: *id001
        template_id: *id001
        status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - COMPLETED
          - OVERDUE
        scheduled_for:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - id
      - outlet_id
      - status
    CheckList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Check'
        meta:
          $ref: '#/components/schemas/Pagination'
    CheckResponseRequest:
      type: object
      properties:
        item_id: *id001
        rule_id: *id001
        response_type:
          type: string
          enum:
          - boolean
          - pass_fail
          - number
          - temperature
          - text
          - photo
          - date
          - select
          - multiselect
          - na
        value: {}
        unit:
          type: string
        notes:
          type: string
        captured_at:
          type: string
          format: date-time
      required:
      - item_id
      - response_type
      - value
    EvaluationResult:
      type: object
      properties:
        outcome:
          type: string
          enum:
          - GOOD
          - ATTENTION
          - ACTION_REQUIRED
          - NA
        risk_level:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        observation_id: *id001
        corrective_action_id: *id001
