openapi: 3.1.0
info:
  title: FoodSafe365 API
  version: 1.0.0
  description: OpenAPI 3.1 contract for FoodSafe365 — Safer food. Every day. Backend
    is the enforcement boundary for tenant isolation, rules, checks, corrective actions,
    records and future services/AI.
servers:
- url: https://api.foodsafe365.com/api/v1
  description: Production
- url: https://staging-api.foodsafe365.com/api/v1
  description: Staging
- url: http://localhost:3000/api/v1
  description: Local development
security:
- bearerAuth: []
tags:
- name: Auth
- name: Organisations
- name: Outlets
- name: Configuration
- name: Rules
- name: Checks
- name: Observations
- name: Actions
- name: Evidence
- name: Documents
- name: Dashboard
- name: Notifications
- name: HACCP
- name: Services
- name: Vendors
- name: Reports
- name: AI
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organisations:
    post:
      tags:
      - Organisations
      summary: Create organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organisations/{organisation_id}:
    get:
      tags:
      - Organisations
      summary: Get organisation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OrganisationId'
    patch:
      tags:
      - Organisations
      summary: Update organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OrganisationId'
  /organisations/{organisation_id}/outlets:
    get:
      tags:
      - Outlets
      summary: List outlets
      responses:
        '200':
          description: Outlet list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Outlet'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OrganisationId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
    post:
      tags:
      - Outlets
      summary: Create outlet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutletCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outlet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OrganisationId'
  /outlets/{outlet_id}:
    get:
      tags:
      - Outlets
      summary: Get outlet
      responses:
        '200':
          description: Outlet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outlet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/profile:
    get:
      tags:
      - Outlets
      summary: Get outlet profile
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/processes:
    get:
      tags:
      - Configuration
      summary: Get outlet processes
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
    post:
      tags:
      - Configuration
      summary: Set outlet processes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsRequest'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/equipment:
    get:
      tags:
      - Configuration
      summary: Add equipment
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
    post:
      tags:
      - Configuration
      summary: Add equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/applicable-rules:
    get:
      tags:
      - Rules
      summary: Get applicable rules
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/check-plan:
    get:
      tags:
      - Checks
      summary: Get generated check plan
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckPlan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/checks/today:
    get:
      tags:
      - Checks
      summary: Get today's checks
      responses:
        '200':
          description: Checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/observations:
    get:
      tags:
      - Observations
      summary: List observations
      responses:
        '200':
          description: Observations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/actions:
    get:
      tags:
      - Actions
      summary: List corrective actions
      responses:
        '200':
          description: Actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/documents:
    get:
      tags:
      - Documents
      summary: List documents
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
    post:
      tags:
      - Documents
      summary: Create document record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/dashboard/today:
    get:
      tags:
      - Dashboard
      summary: Get role-aware dashboard
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/haccp/plans:
    get:
      tags:
      - HACCP
      summary: List HACCP plans
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HaccpPlan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
    post:
      tags:
      - HACCP
      summary: Create HACCP plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HaccpPlanCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HaccpPlan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
  /outlets/{outlet_id}/service-requests:
    get:
      tags:
      - Services
      summary: List service requests
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
    post:
      tags:
      - Services
      summary: Create service request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /outlets/{outlet_id}/reports/monthly:
    get:
      tags:
      - Reports
      summary: Get monthly report
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
      - name: month
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
  /outlets/{outlet_id}/analytics/trends:
    get:
      tags:
      - Reports
      summary: Get trend analytics
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
  /restaurant-types:
    get:
      tags:
      - Configuration
      summary: List restaurant types
      security: []
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /food-processes:
    get:
      tags:
      - Configuration
      summary: List food processes
      security: []
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /equipment-types:
    get:
      tags:
      - Configuration
      summary: List equipment types
      security: []
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /rules:
    get:
      tags:
      - Rules
      summary: List active rules
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: outlet_id
        in: query
        schema: &id001
          type: string
          format: uuid
        required: false
      - name: domain
        in: query
        schema:
          type: string
        required: false
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
  /rules/{rule_id}:
    get:
      tags:
      - Rules
      summary: Get rule
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/RuleId'
  /checks/{check_id}:
    get:
      tags:
      - Checks
      summary: Get check
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/CheckId'
  /checks/{check_id}/start:
    post:
      tags:
      - Checks
      summary: Start check
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/CheckId'
  /checks/{check_id}/responses:
    post:
      tags:
      - Checks
      summary: Submit and evaluate check response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckResponseRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/CheckId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /checks/{check_id}/complete:
    post:
      tags:
      - Checks
      summary: Complete check
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/CheckId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /outlets/{outlet_id}/issues:
    post:
      tags:
      - Observations
      summary: Report spontaneous issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueReportRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/OutletId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /observations/{observation_id}:
    get:
      tags:
      - Observations
      summary: Get observation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/ObservationId'
  /observations/{observation_id}/actions:
    post:
      tags:
      - Actions
      summary: Create corrective action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveAction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/ObservationId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /actions/{action_id}:
    get:
      tags:
      - Actions
      summary: Get corrective action
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveAction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/ActionId'
  /actions/{action_id}/assign:
    post:
      tags:
      - Actions
      summary: Assign corrective action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveAction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/ActionId'
  /actions/{action_id}/start:
    post:
      tags:
      - Actions
      summary: Start corrective action
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveAction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/ActionId'
  /actions/{action_id}/submit-verification:
    post:
      tags:
      - Actions
      summary: Submit for verification
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveAction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/ActionId'
  /actions/{action_id}/verify:
    post:
      tags:
      - Actions
      summary: Verify corrective action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
